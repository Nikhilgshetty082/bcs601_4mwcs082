<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Analyzer</title>
</head>

<body>

<h2>Student Marks Analyzer</h2>

<form method="POST">

    <label>Student Name:</label>
    <input type="text" name="name" required>

    <br><br>

    <label>Subject 1 Marks:</label>
    <input type="number" name="m1" required>

    <br><br>

    <label>Subject 2 Marks:</label>
    <input type="number" name="m2" required>

    <br><br>

    <label>Subject 3 Marks:</label>
    <input type="number" name="m3" required>

    <br><br>

    <input type="submit" value="Calculate Result">

</form>

{% if result %}

<h3>Result</h3>

<p>Name: {{ result.name }}</p>
<p>Total: {{ result.total }}</p>
<p>Average: {{ result.average }}</p>
<p>Percentage: {{ result.percentage }}%</p>
<p>Grade: {{ result.grade }}</p>

{% endif %}

</body>
</html>
